name: hotel_app
description: A Flutter application with Hive ORM, encryption, user roles, favorites, and admin panel.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  url_launcher: ^6.2.1
  image_picker: ^1.0.4
  bloc: ^8.1.3
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Firebase
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  firebase_auth: ^6.1.2
  firebase_database: ^12.0.4
  firebase_messaging: ^16.0.4
  firebase_remote_config: ^6.1.1
  firebase_analytics: ^12.0.4
  google_sign_in: ^6.2.1
  flutter_local_notifications: ^19.5.0
  firebase_app_check: ^0.4.1+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  mockito: ^5.4.4
  integration_test:
    sdk: flutter
  bloc_test: ^9.1.5
flutter:
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

