<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REST Service</title>
    <style>
        <style >
        body {
            position: relative;
            font-family: "Comic Sans MS", "Poppins", 'Segoe UI', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 30px;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.9) 1px, transparent 2px), radial-gradient(circle, rgba(255, 238, 0, 0.6) 1px, transparent 2px), radial-gradient(circle, rgba(255, 255, 255, 0.8) 1px, transparent 2px);
            background-size: 80px 80px, 120px 120px, 150px 150px;
            animation: sparkle 6s linear infinite;
        }

        @keyframes sparkle {
            0% {
                background-position: 0 0, 0 0, 0 0;
            }

            100% {
                background-position: 100px 100px, -100px 50px, 50px -100px;
            }
        }

        .falling {
            position: fixed;
            top: -50px;
            font-size: 24px;
            animation: fall linear forwards;
            z-index: 9999;
            pointer-events: none;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        h1, h2 {
            color: #ff4da6;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 77, 166, 0.7), 0 0 20px rgba(255, 182, 193, 0.7);
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 8px 30px rgba(255, 20, 147, 0.3);
            max-width: 50%;
            width: 100%;
            z-index: 1;
            position: relative;
        }

        .section {
            margin-bottom: 20px;
            padding: 20px;
            border: 2px solid #f8bbd0;
            border-radius: 15px;
            background-color: #fffafc;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.1);
        }

        input[type="number"] {
            width: 120px;
            padding: 12px 20px;
            margin: 10px 5px;
            border: 2px solid #ff8ac3;
            border-radius: 15px;
            outline: none;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fffafc;
        }

            input[type="number"]:focus {
                border-color: #ff4da6;
                box-shadow: 0 0 10px #ffb6c1;
            }

        button {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 6px 20px rgba(255, 20, 147, 0.5);
            transition: all 0.3s ease;
        }

            button:hover {
                transform: translateY(-3px) scale(1.05);
                box-shadow: 0 10px 25px rgba(255, 20, 147, 0.7);
            }

            button:active {
                transform: translateY(2px) scale(0.98);
            }

            button.delete {
                background: linear-gradient(135deg, #ffb6c1, #ff69b4);
            }

        .result {
            margin-top: 10px;
            padding: 12px;
            background-color: #fce4ec;
            border-radius: 12px;
            min-height: 20px;
            font-weight: bold;
        }

        .history {
            margin-top: 20px;
            padding: 12px;
            background-color: #fff0f6;
            border: 2px solid #f8bbd0;
            border-radius: 12px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.95rem;
        }

        .success {
            color: #c2185b;
        }

        .error {
            color: #d81b60;
        }
    </style>
</head>
<body style="display: flex; justify-content: center; background: linear-gradient(135deg, #ff5181, #b53bff);">
    <div class="container">
        <h1>REST</h1>

        <div class="section">
            <h2>Текущее состояние</h2>
            <button onclick="getCurrentResult()">Обновить состояние</button>
            <div id="currentState" class="result">Нажмите "Обновить состояние"</div>
        </div>

        <div class="section">
            <h2>Установка значения RESULT (POST)</h2>
            <input type="number" id="resultValue" placeholder="Значение">
            <button onclick="setResult()">Установить RESULT</button>
            <div id="postResult" class="result"></div>
        </div>

        <div class="section">
            <h2>Операции со стеком</h2>

            <div>
                <h3>Добавить в стек (PUT)</h3>
                <input type="number" id="addValue" placeholder="Значение">
                <button onclick="addToStack()">Добавить (PUSH)</button>
                <div id="putResult" class="result"></div>
            </div>

            <div>
                <h3>Извлечь из стека (DELETE)</h3>
                <button onclick="popFromStack()" class="delete">Извлечь (POP)</button>
                <div id="deleteResult" class="result"></div>
            </div>
        </div>

        <div class="section">
            <h2>История операций</h2>
            <div id="history" class="history"></div>
        </div>
    </div>

    <script>
        const baseUrl = 'http://localhost:8081';
        const testUrl = '/pikmi.GDV';
        let operationCount = 0;

        function addToHistory(method, url, result) {
            operationCount++;
            const historyDiv = document.getElementById('history');
            const entry = document.createElement('div');
            entry.innerHTML = `<strong>#${operationCount} ${method} ${url}</strong><br><span class="${result.includes('error') ? 'error' : 'success'}">${result}</span><hr>`;
            historyDiv.prepend(entry);
        }

        async function getCurrentResult() {
            try {
                const response = await fetch(baseUrl + testUrl);
                const result = await response.json();
                document.getElementById('currentState').innerHTML = `<strong>Текущий RESULT:</strong> ${result.RESULT}`;
                addToHistory('GET', testUrl, JSON.stringify(result));
            } catch (error) {
                document.getElementById('currentState').innerHTML = `<span class="error">Ошибка: ${error.message}</span>`;
            }
        }

        async function setResult() {
            const value = document.getElementById('resultValue').value;
            if (!value) {
                alert('Введите значение!');
                return;
            }

            try {
                const response = await fetch(baseUrl + testUrl + `?RESULT=${value}`, { method: 'POST' });
                const result = await response.json();
                document.getElementById('postResult').innerHTML = `<span class="success">Успешно: RESULT = ${result.RESULT}</span>`;
                addToHistory('POST', testUrl + `?RESULT=${value}`, JSON.stringify(result));
                getCurrentResult();
            } catch (error) {
                document.getElementById('postResult').innerHTML = `<span class="error">Ошибка: ${error.message}</span>`;
            }
        }

        async function popFromStack() {
            try {
                const response = await fetch(baseUrl + testUrl, { method: 'DELETE' });
                const result = await response.json();
                document.getElementById('deleteResult').innerHTML = `<span class="success">Успешно: ${result.status}, RESULT = ${result.RESULT}</span>`;
                addToHistory('DELETE', testUrl, JSON.stringify(result));
                getCurrentResult();
            } catch (error) {
                document.getElementById('deleteResult').innerHTML = `<span class="error">Ошибка: ${error.message}</span>`;
            }
        }

        async function addToStack() {
            const value = document.getElementById('addValue').value;
            if (!value) {
                alert('Введите значение!');
                return;
            }

            try {
                const response = await fetch(baseUrl + testUrl + `?ADD=${value}`, { method: 'PUT' });
                const result = await response.json();
                document.getElementById('putResult').innerHTML = `<span class="success">Успешно: ${result.status}, RESULT = ${result.RESULT}</span>`;
                addToHistory('PUT', testUrl + `?ADD=${value}`, JSON.stringify(result));
                getCurrentResult();
            } catch (error) {
                document.getElementById('putResult').innerHTML = `<span class="error">Ошибка: ${error.message}</span>`;
            }
        }


        window.onload = getCurrentResult;
    </script>
    <script>
        function createFallingEmoji() {
            const emojiList = ["💖", "✨", "💎", "🌸"];
            const emoji = document.createElement("div");
            emoji.classList.add("falling");
            emoji.textContent = emojiList[Math.floor(Math.random() * emojiList.length)];

            emoji.style.left = Math.random() * window.innerWidth + "px";
            emoji.style.fontSize = (20 + Math.random() * 25) + "px";
            const duration = 3 + Math.random() * 5;
            emoji.style.animationDuration = duration + "s";

            document.body.appendChild(emoji);

            setTimeout(() => {
                emoji.remove();
            }, duration * 1000);
        }

        setInterval(createFallingEmoji, 300);
    </script>
</body>
</html>
